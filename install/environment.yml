name: ezST
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - scanpy>=1.10
  - anndata>=0.10
  - leidenalg
  - python-igraph
  - r-base>=4.3
  - r-seurat
  - r-seuratobject
  - r-devtools
  - r-biocmanager
  - pip
  - pip:
    - squidpy>=1.6
    - scvi-tools>=1.2
    - cell2location
    - matplotlib
    - numpy
    - pandas
    - scipy
